[project]
name = "feibi-meme-pack-builder"
version = "0.1.0"
description = "Local-first Phoebe meme pack builder for AstrBot"
requires-python = ">=3.12"
dependencies = ["requests>=2.31,<3", "jsonschema>=4.23,<5", "Pillow>=11,<13"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
