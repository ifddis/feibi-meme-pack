[project]
name = "astrbot-plugin-random-events"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1", "PyYAML>=6,<7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
